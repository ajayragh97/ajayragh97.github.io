<!-- Glassmorphism Site Header -->
<header class="site-header">
    <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="site-logo">
            <span class="logo-text">Ajay Ragh</span>
            <span class="logo-dot"></span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav" aria-label="Main Navigation">
            <ul class="nav-links">
                <li class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
                    <a href="{{ '/' | relative_url }}">Home</a>
                </li>
                <li class="{% if page.url contains '/about' %}active{% endif %}">
                    <a href="{{ '/about' | relative_url }}">About</a>
                </li>
                <li class="{% if page.url contains '/novels' %}active{% endif %}">
                    <a href="{{ '/novels' | relative_url }}">AI Novels</a>
                </li>
                <li class="{% if page.url contains '/blog' %}active{% endif %}">
                    <a href="{{ '/blog' | relative_url }}">Blog</a>
                </li>
            </ul>
        </nav>

        <div class="header-actions">
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" class="icon-btn theme-btn" aria-label="Toggle Dark Mode" title="Toggle Theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <!-- Social Quick Links -->

                </svg>
            </a>

            <a href="https://www.linkedin.com/in/ajay-ragh/" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="LinkedIn Profile" title="LinkedIn">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="currentColor">

            <!-- Mobile Hamburger Toggle -->
            <button id="mobile-menu-toggle" class="icon-btn mobile-toggle" aria-label="Toggle Mobile Menu">
                <svg class="menu-open-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>

    </div>

    <!-- Mobile Navigation Drawer -->
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile Navigation">
        <ul class="mobile-nav-links">
            <li class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
                <a href="{{ '/' | relative_url }}">Home</a>
            </li>
            <li class="{% if page.url contains '/about' %}active{% endif %}">
                <a href="{{ '/about' | relative_url }}">About</a>
            </li>
            <li class="{% if page.url contains '/novels' %}active{% endif %}">
                <a href="{{ '/novels' | relative_url }}">AI Novels</a>
            </li>
            <li class="{% if page.url contains '/blog' %}active{% endif %}">
                <a href="{{ '/blog' | relative_url }}">Blog</a>
            </li>
        </ul>
    </nav>
</header>
